name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create database roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/db-init.sql
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web
        run: npm run build
        env:
          APP_SECRET: ci-only-secret-ci-only-secret-ci-only
          DATABASE_URL: postgres://relayos_app:relayos_app@localhost:5432/relayos
