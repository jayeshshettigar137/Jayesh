# Local Postgres for development and tests: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - relayos-pg:/var/lib/postgresql/data
volumes:
  relayos-pg:
