<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RelayFlow{% endblock %}</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e3e2dc;--accent:#1f6f5c;--warn:#a15c00;--bad:#a12a2a;--good:#1f6f3a}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#5fc2a6;--warn:#e0a14a;--bad:#e07a7a;--good:#78c98f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--accent)}header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header .brand{font-weight:700;margin-right:8px}header nav{display:flex;flex-wrap:wrap;gap:12px}header nav a{text-decoration:none;color:var(--ink)}
header .spacer{flex:1}main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat .n{font-size:26px;font-weight:700}.stat .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl{overflow-x:auto}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:120px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:7px 14px;text-decoration:none;display:inline-block}
button.secondary,.btn.secondary{background:transparent;color:var(--accent)}button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.inline{display:inline}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.new{border-color:var(--accent);color:var(--accent)}.pill.booked,.pill.sent{border-color:var(--good);color:var(--good)}
.pill.lost,.pill.failed,.pill.rejected{border-color:var(--bad);color:var(--bad)}.pill.draft,.pill.flag{border-color:var(--warn);color:var(--warn)}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:16px;border:1px solid var(--good);color:var(--good)}.flash.err{border-color:var(--bad);color:var(--bad)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}code{font-size:13px;word-break:break-all}
h1{font-size:22px;margin:0 0 16px}h2{font-size:17px;margin:0 0 12px}
</style>
</head>
<body>
{% if user %}
<header>
  <span class="brand">RelayFlow</span>
  <nav>
    <a href="/">Dashboard</a><a href="/leads">Leads</a><a href="/approvals">Approvals</a>
    <a href="/sequence">Follow-up</a><a href="/data">Import/Export</a><a href="/audit">Audit log</a>
    <a href="/settings">Settings</a><a href="/billing">Billing</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">{{ workspace.name }}</span>
  <form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">Log out</button></form>
</header>
{% endif %}
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
